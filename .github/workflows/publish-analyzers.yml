name: Publish Analyzers

# Bannerlord.UIExtenderEx.Analyzers ships on its own, independently of UIExtenderEx: its version is the UIExtenderEx
# version it is built with and this workflow's run number (2.13.3.<run>), so every run publishes a version of its own.
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-analyzers.yml'
      - 'src/Bannerlord.UIExtenderEx.Analyzers/**'
      - 'src/Bannerlord.UIExtenderEx.Analyzers.CodeFixes/**'
      - 'build/**'
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Analyzer Tests
    # net472 is what Visual Studio runs analyzers on
    runs-on: windows-latest
    steps:
      - name: Setup
        uses: butr/actions-common-setup@v2
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}

      - name: Test
        # Needs no game: the code under test compiles against reference packages
        run: >-
          mkdir bannerlord;
          dotnet test tests/Bannerlord.UIExtenderEx.Analyzers.Tests/Bannerlord.UIExtenderEx.Analyzers.Tests.csproj --configuration Release -p:GameFolder="$PWD/bannerlord";
        shell: pwsh

  ###########################
  #        NUGET/GPR        #
  ###########################
  publish-on-nuget:
    name: Publish on NuGet/GPR
    needs: ["test"]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token for nuget.org
      contents: read
      packages: write # the push to GitHub Packages
    steps:
      - name: Setup
        uses: butr/actions-common-setup@v2
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}

      - name: Pack
        run: dotnet pack src/Bannerlord.UIExtenderEx.Analyzers/Bannerlord.UIExtenderEx.Analyzers.csproj --configuration Release -o "./packages"
        shell: pwsh

      # Right before the push: the key it returns is valid for an hour
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # the nuget.org profile name of the policy's owner, not an email address

      - name: Push to NuGet
        run: dotnet nuget push "./packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        shell: pwsh

      - name: Push to GPR
        run: |
             for f in ./packages/*.nupkg
             do
               curl -vX PUT -u "vslee:${{ secrets.GITHUB_TOKEN }}" -F package=@$f https://nuget.pkg.github.com/BUTR/
             done
